[project]
name = "cocowork-backend"
version = "0.1.0"
description = "CoCoWork backend — AI Agent management platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.128.0",
    "tortoise-orm[asyncpg]>=1.1.7",
    "redis>=6.2.0",
    "pydantic-settings>=2.6.0",
    "bcrypt==4.0.1",
    "passlib[argon2,bcrypt]>=1.7.4",
    "pyjwt>=2.11.0",
    "uuid-utils>=0.14.0",
    "pyyaml>=6.0.3",
    "boto3>=1.42.67",
    "tavily-python>=0.7.23",
    "colorlog>=6.9.0",
    "python-json-logger>=3.2.1",
    "cryptography>=48.0.0",
    "openai>=2.38.0",
    "langchain-text-splitters>=1.1.2",
    "langchain>=1.3.4",
    "langchain-openai>=1.2.2",
    "langchain-anthropic>=1.4.4",
    "deepagents>=0.6.10",
    "langgraph>=1.2.4",
    # checkpointer 的 Postgres 后端。psycopg 必须显式带上两个 extra：
    # binary 提供预编译的 libpq（缺了直接 no pq wrapper available），
    # pool 提供连接池实现（psycopg 本体只会连单条）
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg[binary,pool]>=3.3.4",
    "langfuse>=4.11.0",
    "langchain-mcp-adapters>=0.3.0",
    "jieba>=0.42.1",
    "saq>=0.26.4",
    "charset-normalizer>=3.4.7",
    "skills-ref>=0.1.1",
    "pdfplumber>=0.11.10",
    "docker[ssh]>=7.1.0",
]

# 进程入口：uv sync 时据此在 .venv/bin/ 生成同名可执行文件，
# 之后 `uv run dev` 起 web、`uv run worker` 起任务队列
[project.scripts]
dev = "app.cli:dev"
worker = "app.cli:worker"
sandboxd = "app.cli:sandboxd"

[dependency-groups]
benchmarks = [
    "ranx>=0.3.21",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.tortoise]
tortoise_orm = "app.db.postgresql.TORTOISE_CONFIG"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
