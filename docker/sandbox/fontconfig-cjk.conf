<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 沙箱渲染用：文档里常见的中文字体名统一映射到文泉驿正黑（镜像里唯一的中文字体）。 -->
<fontconfig>
  <alias binding="same">
    <family>Microsoft YaHei</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias binding="same">
    <family>微软雅黑</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias binding="same">
    <family>PingFang SC</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias binding="same">
    <family>SimHei</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias binding="same">
    <family>黑体</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias binding="same">
    <family>SimSun</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias binding="same">
    <family>宋体</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias binding="same">
    <family>Noto Sans CJK SC</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <alias binding="same">
    <family>Source Han Sans SC</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
  <!-- 通用族名也优先中文字体：没写字体或写了 sans-serif 时，中文不至于掉成方块 -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>WenQuanYi Zen Hei</family></prefer>
  </alias>
</fontconfig>
